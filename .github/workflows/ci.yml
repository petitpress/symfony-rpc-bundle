name: CI

on:
    push:
        branches: [ master, "3.x" ]
    pull_request:
        branches: [ master, "3.x" ]

jobs:
    tests:
        name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ '8.5' ]
                symfony: [ '5.4.*', '6.4.*', '7.*', '8.*' ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: curl, dom, json, libxml, mbstring
                    coverage: none
                    tools: composer:v2, flex

            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache composer dependencies
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-php-${{ matrix.php }}-sf-${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
                    restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-sf-${{ matrix.symfony }}-

            -   name: Pin Symfony version
                run: composer config --no-plugins extra.symfony.require "${{ matrix.symfony }}"

            -   name: Install dependencies
                run: composer update --prefer-dist --no-interaction --no-progress

            -   name: Run PHPUnit
                run: vendor/bin/phpunit
